[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "world-scene-actors"
version = "0.2.5"
description = "Local-first world management and multi-session scene orchestration prototype."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
wsa = "wsa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
